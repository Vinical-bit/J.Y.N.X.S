<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 3: Contador</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #212529;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        p {
            color: #6c757d;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        #contadorValor {
            display: block;
            font-size: 5rem;
            font-weight: bold;
            color: #0d6efd;
            margin: 1.5rem 0;
            transition: transform 0.2s ease;
        }

        .controles {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap; 
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
            min-width: 80px;
        }

        button:active {
            transform: scale(0.95);
        }

        #diminuir {
            background-color: #dc3545;
            color: white;
        }

        #resetar {
            background-color: #6c757d;
            color: white;
        }

        #aumentar {
            background-color: #198754;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <main class="card">
        <h1>Desafio 3: Contador</h1>
        
        <p>Use os botões para aumentar, diminuir e resetar o valor.</p>

        <!-- Elemento que exibe o valor atualizado do contador -->
        <span id="contadorValor">0</span>

        <div class="controles">
            <!-- Botao que chama a funcao para decrementar o contador -->
            <button id="diminuir" onclick="diminuir()">-1</button>
            <!-- Botao que chama a funcao para resetar o contador -->
            <button id="resetar">Resetar</button>
            <!-- Botao que chama a funcao para incrementar o contador -->
            <button id="aumentar">+1</button>
        </div>
    </main>
    
    <!-- Script carregado ao final para manipular os elementos da pagina -->
    <script defer src="script.js"></script>
</body>
</html>
